[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morphda"
version = "0.1.0"
description = "Benchmark and verifier for LLM data-analysis agents: metamorphic testing and mutation testing catch wrong filters, aggregations and periods in agent-written pandas code, with no gold answer and no extra LLM call."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Prateek Kohli" },
    { name = "Karun Thankachan" },
]
keywords = [
    "data analysis agents", "llm agents", "agent evaluation", "agent verification",
    "metamorphic testing", "mutation testing", "benchmark", "llm evaluation",
    "data science agents", "pandas", "code generation", "text-to-sql", "nl2sql",
    "software testing", "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "libcst>=1.4",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/prateekkohli2018-ampba/morphda"
Paper = "https://openreview.net/forum?id=JsrKw3nUSV"
Documentation = "https://github.com/prateekkohli2018-ampba/morphda#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
llm = [
    "anthropic>=0.28",
    "openai>=1.30",
]

[project.scripts]
morphda = "morphda.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
